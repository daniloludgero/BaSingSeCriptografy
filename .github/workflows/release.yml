name: Release & Distribution

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify KAT Vectors & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt

      - name: Run pre-release KAT & unit verification gate
        run: |
          python ferramentas/rsd_cli.py kat
          python -m unittest discover -s testes -p "test_*.py" -v

      - name: Build Python sdist and wheel
        run: |
          python -m build
          sha256sum dist/* testes/vetores_v4.json > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            testes/vetores_v4.json
            RELATORIO_FINAL.md
