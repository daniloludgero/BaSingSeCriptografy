name: Cryptanalysis Finding / Trail Report
description: Report a concrete differential trail, linear bias, algebraic distinguisher, or SAT/SMT result on RSD-S
title: "[Cryptanalysis]: "
labels: ["cryptanalysis", "research"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to the cryptanalysis of **RSD-S (Riemann Spectral Diffusion)**!
        Please provide reproducible inputs, witness values, or solver scripts so the finding can be verified and documented in `resultados/`.

  - type: dropdown
    id: attack_family
    attributes:
      label: Cryptanalysis Vector / Technique
      options:
        - Differential Cryptanalysis (Characteristic / Hull / Boomerang)
        - Linear / Walsh-Hadamard Correlation
        - Algebraic / Gröbner Basis / Interpolation over GF(2^16)
        - SAT / SMT / MILP Encoding & Solver Result
        - Related-Key / HMAC Key Schedule Analysis
        - Integral / Division Property / Subspace Trail
        - Other Structural Observation
    validations:
      required: true

  - type: dropdown
    id: target_rounds
    attributes:
      label: Target Round Count
      options:
        - 1 Round
        - 2 Rounds
        - 3 Rounds
        - 4 Rounds (Official v4 API)
        - 6+ Rounds (Experimental)
    validations:
      required: true

  - type: textarea
    id: mathematical_summary
    attributes:
      label: Mathematical Summary & Claimed Weight / Complexity
      description: State the exact probability weight (e.g., 2^-k), active S-box pattern, or solver result (SAT/UNSAT).
      placeholder: "Active pattern: (1, 32, 31, 32), DDT transitions: ..., Weight: 2^-..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Script / Witness Values
      description: Paste a minimal Python/Z3/DIMACS reproduction command or concrete witness pair (x, y, s, n_sess).
      render: bash
    validations:
      required: true
