<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">RSD-S v4 Cryptographic Diffusion Pipeline Architecture</title>
  <desc id="arch-desc">Diagram showing two F_p scalars x and y fragmented into 32 16-bit words (512 bits), whitened with K_0, processed through 4 rounds of GF(2^16) Inversion S-Box, Round Constant XOR, 32x32 Cauchy MDS matrix (branch number 33), and Round Key XOR, followed by SHA-256 finalization.</desc>
  <defs>
    <style>
      .bg { fill: #0b0f14; }
      .grid { stroke: #161f2c; stroke-width: 1; }
      .card { fill: #111822; stroke: #263548; stroke-width: 1.5; rx: 8; }
      .card-accent { fill: #0f2229; stroke: #10b981; stroke-width: 1.8; rx: 8; }
      .card-mds { fill: #141d2f; stroke: #38bdf8; stroke-width: 1.8; rx: 8; }
      .title { fill: #f1f5f9; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .node-title { fill: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .node-sub { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; text-anchor: middle; }
      .node-tag { fill: #10b981; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .node-tag-blue { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .badge { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="320" rx="12" class="bg" />
  <line x1="0" y1="54" x2="960" y2="54" class="grid" />

  <!-- Header -->
  <text x="24" y="34" class="title">RSD-S v4 — 512-BIT KEYED SPN DIFFUSION ARCHITECTURE</text>
  <text x="936" y="34" class="subtitle" text-anchor="end">GF(2^16) Poly: 0x1100B | Cauchy MDS 32x32 | Branch Number = 33</text>

  <!-- Stage 1: Inputs -->
  <rect x="24" y="88" width="145" height="148" class="card" />
  <text x="96" y="118" class="node-title">INPUTS (F_p²)</text>
  <text x="96" y="138" class="node-sub">x, y ∈ [0, 2^255 - 19)</text>
  <text x="96" y="158" class="node-sub">Key s (256-bit)</text>
  <text x="96" y="176" class="node-sub">Nonce n_sess (64-bit)</text>
  <text x="96" y="212" class="node-tag">Full 256-bit Slices</text>

  <path d="M 169 162 L 199 162" class="arrow" />

  <!-- Stage 2: Fragmentation & Whitening -->
  <rect x="200" y="88" width="155" height="148" class="card" />
  <text x="277" y="118" class="node-title">FRAGMENT + K_0</text>
  <text x="277" y="138" class="node-sub">16 × 16-bit slices (x)</text>
  <text x="277" y="156" class="node-sub">16 × 16-bit slices (y)</text>
  <text x="277" y="176" class="node-sub">State: 32 words (512b)</text>
  <text x="277" y="212" class="node-tag-blue">State ⊕ Expand(K_0)</text>

  <path d="M 355 162 L 385 162" class="arrow-accent" />

  <!-- Stage 3: 4 SPN Rounds Container -->
  <rect x="386" y="72" width="386" height="184" class="card-accent" />
  <text x="579" y="96" class="node-title">ITERATED SPN CORE (r = 1 .. 4 ROUNDS)</text>

  <!-- Sub-block 3A: S-Box -->
  <rect x="402" y="112" width="166" height="122" class="card" />
  <text x="485" y="136" class="node-title">GF(2^16) S-BOX</text>
  <text x="485" y="156" class="node-sub">w_i ← Inv(w_i) ⊕ RC_r</text>
  <text x="485" y="174" class="node-sub">Bijection: 65,536 / 65,536</text>
  <text x="485" y="192" class="node-sub">Max DDT = 4 (2^-14)</text>
  <text x="485" y="216" class="node-tag">Max Walsh = 512 (2^-7)</text>

  <path d="M 568 173 L 588 173" class="arrow-accent" />

  <!-- Sub-block 3B: Cauchy MDS + Key -->
  <rect x="590" y="112" width="166" height="122" class="card-mds" />
  <text x="673" y="136" class="node-title">CAUCHY MDS 32×32</text>
  <text x="673" y="156" class="node-sub">M[i,j] = (x_i ⊕ y_j)^-1</text>
  <text x="673" y="174" class="node-sub">Rank: 32/32 over GF(2^16)</text>
  <text x="673" y="192" class="node-sub">State ← M · State ⊕ K_r</text>
  <text x="673" y="216" class="node-tag-blue">4-Round Active ≥ 66</text>

  <path d="M 772 162 L 802 162" class="arrow-accent" />

  <!-- Stage 4: Finalization -->
  <rect x="803" y="88" width="133" height="148" class="card" />
  <text x="869" y="118" class="node-title">FINALIZE</text>
  <text x="869" y="138" class="node-sub">512b Pre-SHA State</text>
  <text x="869" y="158" class="node-sub">SHA-256 Digest</text>
  <text x="869" y="178" class="node-sub">32 Bytes Output</text>
  <text x="869" y="212" class="node-tag">50.31% Avalanche</text>

  <!-- Footer Telemetry Bar -->
  <rect x="24" y="272" width="912" height="32" class="badge" />
  <text x="40" y="292" class="subtitle">Empirical Verification: Pre-SHA Avalanche = 50.31% (σ = 1.87%) | Post-SHA Avalanche = 49.53% (σ = 3.34%) | Concrete 4R Trail Weight = 2^-1439 | Synthesized MDS = 45,050 XOR gates</text>
</svg>
