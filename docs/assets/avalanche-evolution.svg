<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="auto" role="img" aria-labelledby="evol-title evol-desc">
  <title id="evol-title">RSD-S Empirical Avalanche Evolution (v0 to v4)</title>
  <desc id="evol-desc">Bar chart comparing measured avalanche diffusion across versions v0 (9.34%), v1 (18.65%), v2 (19.90%), v3 (23.79%), and v4 (50.31% pre-SHA, 49.53% post-SHA) against the 50% strict avalanche criterion target.</desc>
  <defs>
    <style>
      .bg { fill: #0b0f14; }
      .panel { fill: #111822; stroke: #263548; stroke-width: 1.5; rx: 8; }
      .title { fill: #f1f5f9; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 700; }
      .label { fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
      .sub { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
      .val-fail { fill: #f87171; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; }
      .val-warn { fill: #fbbf24; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; }
      .val-pass { fill: #10b981; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; }
      .bar-bg { fill: #1e293b; rx: 4; }
      .bar-fail { fill: #ef4444; rx: 4; }
      .bar-warn { fill: #f59e0b; rx: 4; }
      .bar-pass { fill: #10b981; rx: 4; }
      .target-line { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 5,4; }
    </style>
  </defs>

  <rect width="960" height="290" rx="12" class="bg" />
  <rect x="16" y="16" width="928" height="258" class="panel" />

  <text x="36" y="46" class="title">DIAGNOSTIC AVALANCHE EVOLUTION (v0 → v4) — WHY ALL THREE FIXES WERE REQUIRED</text>
  <text x="920" y="46" class="val-pass" text-anchor="end">Ideal Strict Avalanche Target: 50.0%</text>

  <!-- Target 50% vertical line at x = 280 + 420 = 700 (scale: 0% = 280, 60% = 784 => 8.4px per 1%) -->
  <line x1="700" y1="64" x2="700" y2="252" class="target-line" />
  <text x="700" y="266" class="sub" text-anchor="middle">50.0% Target</text>

  <!-- Row 1: v0 -->
  <text x="36" y="88" class="label">v0 — Original Linear</text>
  <text x="36" y="102" class="sub">No S-box, QR rotation only</text>
  <rect x="280" y="74" width="504" height="22" class="bar-bg" />
  <rect x="280" y="74" width="78" height="22" class="bar-fail" />
  <text x="368" y="90" class="val-fail">9.34% (Broken by 8-sample linear algebra)</text>

  <!-- Row 2: v1 -->
  <text x="36" y="130" class="label">v1 — RSD-S Spec</text>
  <text x="36" y="144" class="sub">Rank 5/16 matrix + Chebyshev</text>
  <rect x="280" y="116" width="504" height="22" class="bar-bg" />
  <rect x="280" y="116" width="156" height="22" class="bar-fail" />
  <text x="446" y="132" class="val-fail">18.65% (Singular matrix, S-box only 35.7% unique)</text>

  <!-- Row 3: v2 -->
  <text x="36" y="172" class="label">v2 — Cauchy MDS Fix</text>
  <text x="36" y="186" class="sub">Rank 16/16 GF(2^16) MDS</text>
  <rect x="280" y="158" width="504" height="22" class="bar-bg" />
  <rect x="280" y="158" width="167" height="22" class="bar-warn" />
  <text x="457" y="174" class="val-warn">19.90% (Matrix fixed, Chebyshev S-box bottleneck)</text>

  <!-- Row 4: v3 -->
  <text x="36" y="214" class="label">v3 — GF(2^16) Inv S-Box</text>
  <text x="36" y="228" class="sub">Bijective S-box + Cauchy MDS</text>
  <rect x="280" y="200" width="504" height="22" class="bar-bg" />
  <rect x="280" y="200" width="200" height="22" class="bar-warn" />
  <text x="490" y="216" class="val-warn">23.79% (128-bit slicing still dropped 127 bits of F_p!)</text>

  <!-- Row 5: v4 -->
  <text x="36" y="250" class="label">v4 — Full 512-Bit State</text>
  <text x="36" y="264" class="sub">16×16b slicing + 32×32 MDS</text>
  <rect x="280" y="238" width="504" height="22" class="bar-bg" />
  <rect x="280" y="238" width="422" height="22" class="bar-pass" />
  <text x="712" y="254" class="val-pass">50.31% Pre-SHA / 49.53% Post-SHA (PASSED)</text>
</svg>
